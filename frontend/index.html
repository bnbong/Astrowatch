<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astrowatch · 대화</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="주 메뉴">
    <a class="brand" href="index.html" aria-label="Astrowatch 홈"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="3 4"></circle><circle cx="15" cy="15" r="5.5" fill="#1B2A4A"></circle><circle cx="24" cy="8" r="2" fill="#B8731B"></circle></svg><span class="brand-name">Astrowatch</span></a>
    <a class="rail-link" href="index.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>대화</span></a>
    <a class="rail-link" href="plans.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span>관측 계획</span><span class="rail-count" id="rail-plan-count" hidden></span></a>
    <a class="rail-link" href="logs.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg><span>실행 로그</span></a>
    <section class="convo-box" aria-labelledby="convo-heading">
      <h2 id="convo-heading" class="convo-heading" tabindex="-1">최근 대화</h2>
      <ul id="convo-list" class="convo-list"><li class="convo-empty">불러오는 중…</li></ul>
    </section>
    <div class="rail-card" id="health" aria-live="polite"><div class="rail-card-title">연결 상태</div><div class="muted">확인 중…</div></div>
  </nav>
  <main class="chat-layout">
    <section class="chat-col" aria-label="대화">
      <header class="chat-head">
        <a class="mobile-brand" href="index.html" aria-label="Astrowatch 홈"><svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="3 4"></circle><circle cx="15" cy="15" r="5.5" fill="#1B2A4A"></circle><circle cx="24" cy="8" r="2" fill="#B8731B"></circle></svg><span class="brand-name">Astrowatch</span></a>
        <h1 class="page-title">관측 계획 짜기</h1>
        <span id="session-label" class="session-chip">새 대화</span>
        <button type="button" id="convo-toggle" class="btn btn-sm convo-toggle" aria-controls="convo-sheet" aria-expanded="false">대화 목록</button>
        <button type="button" id="new-chat" class="btn btn-sm">새 대화</button>
      </header>

      <section id="convo-sheet" class="convo-sheet" aria-labelledby="convo-heading-m" hidden>
        <div class="convo-sheet-head">
          <h2 id="convo-heading-m" class="convo-heading">최근 대화</h2>
          <button type="button" id="convo-close" class="btn btn-icon" aria-label="대화 목록 닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <ul id="convo-list-m" class="convo-list"></ul>
      </section>

      <div id="cond-strip" class="cond-strip" aria-label="현재 조건"></div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer">
        <button type="button" id="sheet-handle" class="sheet-handle" aria-controls="exec-panel" aria-expanded="false">
          <span class="grip" aria-hidden="true"></span>
          <span>실행 과정</span>
          <span id="sheet-summary" class="num">아직 실행 없음</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
        </button>
        <p id="status" class="status" hidden><span class="spinner" aria-hidden="true"></span> 처리 중… Tool 을 호출하고 있습니다</p>
        <div class="examples" aria-label="예시 질문">
          <button type="button" class="chip" data-example="12월 14일 밤 서울에서 쌍둥이자리 유성우 볼 수 있어?">쌍둥이자리 유성우</button>
          <button type="button" class="chip" data-example="이번 주말 대전 근처 천문대 추천해 줘">주말 대전 천문대</button>
          <button type="button" class="chip" data-example="다음 주 강원도에서 별 보기 좋은 날은?">다음 주 강원도</button>
          <button type="button" class="chip" data-example="대전 유성구에서 안드로메다 은하 보기 좋은 날짜 추천해 줘">안드로메다 은하</button>
        </div>
        <form id="chat-form" class="chat-form">
          <label for="chat-input" class="sr-only">메시지</label>
          <textarea id="chat-input" rows="2" maxlength="2000" placeholder="날짜 · 지역 · 보고 싶은 현상을 적어 주세요"></textarea>
          <button type="submit" id="send-btn" class="send-btn" aria-label="보내기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        </form>
      </div>
    </section>

    <aside id="exec-panel" class="exec-panel" aria-label="실행 패널">
      <div class="exec-tabs" role="tablist" aria-label="패널 전환">
        <button type="button" role="tab" id="tab-timeline" class="exec-tab" aria-selected="true" aria-controls="pane-timeline">실행 타임라인</button>
        <button type="button" role="tab" id="tab-evidence" class="exec-tab" aria-selected="false" aria-controls="pane-evidence" tabindex="-1">근거 데이터</button>
        <button type="button" id="exec-close" class="btn btn-icon exec-close" aria-label="실행 패널 닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div id="pane-timeline" class="exec-body" role="tabpanel" aria-labelledby="tab-timeline">
        <div id="timeline"><p class="empty">메시지를 보내면 실행 단계가 여기에 표시됩니다.</p></div>
      </div>
      <div id="pane-evidence" class="exec-body" role="tabpanel" aria-labelledby="tab-evidence" hidden>
        <div id="evidence"><p class="empty">추천·제외 후보의 판단 근거와 Tool 응답 요약이 여기에 표시됩니다.</p></div>
      </div>
      <div id="exec-summary" class="exec-summary">
        <div class="row"><span>Tool 호출</span><b id="sum-tools">—</b></div>
        <div class="row"><span>재계획</span><b id="sum-replan">—</b></div>
        <a id="sum-log" href="logs.html" hidden>이 세션의 전체 로그 →</a>
      </div>
    </aside>
  </main>
  <nav class="tabbar" aria-label="주 메뉴(모바일)">
    <a class="tab" href="index.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>대화</span></a>
    <a class="tab" href="plans.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span>계획</span></a>
    <a class="tab" href="logs.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg><span>로그</span></a>
  </nav>
</div>
  <script src="js/api.js?v=7"></script>
  <script src="js/markdown.js?v=7"></script>
  <script src="js/ui.js?v=7"></script>
  <script src="js/timeline.js?v=7"></script>
  <script src="js/chat.js?v=7"></script>
</body>
</html>
