<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astrowatch · 실행 로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="주 메뉴">
    <a class="brand" href="index.html" aria-label="Astrowatch 홈"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="3 4"></circle><circle cx="15" cy="15" r="5.5" fill="#1B2A4A"></circle><circle cx="24" cy="8" r="2" fill="#B8731B"></circle></svg><span class="brand-name">Astrowatch</span></a>
    <a class="rail-link" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>대화</span></a>
    <a class="rail-link" href="plans.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span>관측 계획</span><span class="rail-count" id="rail-plan-count" hidden></span></a>
    <a class="rail-link" href="logs.html" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg><span>실행 로그</span></a>
    <div class="rail-card" id="health" aria-live="polite"><div class="rail-card-title">연결 상태</div><div class="muted">확인 중…</div></div>
  </nav>
  <main class="split logs-split">
    <section class="sessions-col" aria-label="세션 목록">
      <header class="page-head">
        <a class="mobile-brand" href="index.html" aria-label="Astrowatch 홈"><svg width="24" height="24" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#1B2A4A" stroke-width="1.5" stroke-dasharray="3 4"></circle><circle cx="15" cy="15" r="5.5" fill="#1B2A4A"></circle><circle cx="24" cy="8" r="2" fill="#B8731B"></circle></svg></a>
        <h1 class="page-title">실행 로그</h1>
        <span id="sessions-count" class="page-sub"></span>
        <button type="button" id="reload-btn" class="btn btn-sm" style="margin-left:auto">새로고침</button>
      </header>
      <div class="field">
        <label for="session-search">세션 검색</label>
        <input id="session-search" class="input" type="search" placeholder="첫 메시지 · 세션 ID" autocomplete="off">
      </div>
      <div id="page-msg" class="banner" role="status" hidden></div>
      <ol id="session-list" class="session-list"></ol>
      <p id="sessions-empty" class="muted" hidden>기록된 실행 로그가 없습니다.</p>
    </section>

    <section id="session-detail" class="events-col" aria-label="세션 이벤트">
      <p class="drawer-empty">왼쪽에서 세션을 고르면 이벤트가 발생 순서대로 표시됩니다. 실행 로그는 조회와 삭제만 할 수 있습니다.</p>
    </section>
  </main>
  <nav class="tabbar" aria-label="주 메뉴(모바일)">
    <a class="tab" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>대화</span></a>
    <a class="tab" href="plans.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span>계획</span></a>
    <a class="tab" href="logs.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg><span>로그</span></a>
  </nav>
</div>
  <script src="js/api.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/logs.js?v=6"></script>
</body>
</html>
